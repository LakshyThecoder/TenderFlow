<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TenderFlow Spatial Telemetry Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      overflow: hidden;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Customize Leaflet styles to match Navy premium dashboard */
    .leaflet-container {
      background: #09090b !important;
      outline: 0;
    }
    
    /* Apply premium grayscale dark filter to standard tiles */
    .leaflet-tile {
      filter: grayscale(100%) brightness(0.4) contrast(1.1) !important;
    }
    
    .leaflet-bar {
      border: 1px solid #18181b !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6) !important;
      border-radius: 6px !important;
      overflow: hidden;
    }
    
    .leaflet-bar a {
      background-color: #09090b !important;
      color: #71717a !important;
      border-bottom: 1px solid #18181b !important;
      transition: all 0.2s;
    }
    
    .leaflet-bar a:hover {
      background-color: #18181b !important;
      color: #f4f4f5 !important;
    }

    /* Hide Leaflet Attribution or style it ultra-minimally */
    .leaflet-control-attribution {
      background: rgba(9, 9, 11, 0.9) !important;
      color: #52525b !important;
      font-size: 8px !important;
      border-top: 1px solid #18181b;
      border-left: 1px solid #18181b;
      border-top-left-radius: 6px;
    }
    .leaflet-control-attribution a {
      color: #71717a !important;
      text-decoration: none;
    }

    /* Custom Pulsing Radar Marker Pin */
    .custom-marker-container {
      position: relative;
    }

    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 30px;
      height: 30px;
    }
    
    .marker-dot {
      width: 8px;
      height: 8px;
      background-color: #71717a;
      border: 1.5px solid #09090b;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(113, 113, 122, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }
    
    .marker-ring-1 {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(113, 113, 122, 0.25);
      border-radius: 50%;
      animation: pulse-ring 2.5s infinite ease-out;
      pointer-events: none;
      z-index: 1;
    }

    .marker-ring-2 {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(113, 113, 122, 0.1);
      border-radius: 50%;
      animation: pulse-ring 2.5s infinite ease-out 0.8s;
      pointer-events: none;
      z-index: 0;
    }
    
    /* Active Node Overrides */
    .custom-marker.active .marker-dot {
      background-color: #ffffff;
      border-color: #09090b;
      transform: scale(1.3);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }
    
    .custom-marker.active .marker-ring-1 {
      border-color: rgba(255, 255, 255, 0.4);
      animation: pulse-active 2s infinite ease-out;
    }

    .custom-marker.active .marker-ring-2 {
      border-color: rgba(161, 161, 170, 0.25);
      animation: pulse-active 2s infinite ease-out 0.6s;
    }
    
    /* Monospace Minimalist City Label */
    .marker-label {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 8px;
      font-weight: 700;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: #09090b;
      border: 1px solid #18181b;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .custom-marker.active .marker-label {
      color: #06b6d4;
      border-color: rgba(6, 182, 212, 0.3);
      background: rgba(10, 20, 42, 0.95);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 12px rgba(6, 182, 212, 0.15);
      font-weight: 800;
      letter-spacing: 0.15em;
      transform: translateX(-50%) translateY(2px);
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.5);
        opacity: 1;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
    
    @keyframes pulse-active {
      0% {
        transform: scale(0.5);
        opacity: 1;
      }
      100% {
        transform: scale(2.3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // Initialize map centered on Italy
    var map = L.map('map', {
      zoomControl: true,
      attributionControl: true,
      minZoom: 5,
      maxZoom: 10,
      zoomSnap: 0.1
    }).setView([42.2, 12.3], 5.8);

    // Load CartoDB Dark Matter tile layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // Tender locations coordinates
    var nodes = [
      { id: "tender-1", city: "Milano", coords: [45.4642, 9.1900] },
      { id: "tender-2", city: "Torino", coords: [45.0703, 7.6869] },
      { id: "tender-5", city: "Venezia", coords: [45.4408, 12.3155] },
      { id: "tender-3", city: "Roma", coords: [41.9028, 12.4964] },
      { id: "tender-4", city: "Napoli", coords: [40.8518, 14.2681] }
    ];

    var markers = {};

    // Connect nodes with a glowing dashed telemetry grid line
    var networkLine = L.polyline(nodes.map(function(n) { return n.coords; }), {
      color: '#3f3f46',
      weight: 1.5,
      opacity: 0.35,
      dashArray: '4, 8',
      lineCap: 'round'
    }).addTo(map);

    // Create markers for each city
    nodes.forEach(function(node) {
      // Define custom divicon
      var customIcon = L.divIcon({
        className: 'custom-marker-container',
        html: '<div class="custom-marker" id="marker-' + node.id + '">' +
                '<div class="marker-dot"></div>' +
                '<div class="marker-ring-1"></div>' +
                '<div class="marker-ring-2"></div>' +
                '<div class="marker-label">' + node.city + '</div>' +
              '</div>',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      var marker = L.marker(node.coords, { icon: customIcon }).addTo(map);
      markers[node.id] = marker;

      // Handle marker click: select tender in Next.js parent app
      marker.on('click', function() {
        window.parent.postMessage({
          type: 'SELECT_TENDER',
          id: node.id
        }, '*');
        
        setActiveMarker(node.id);
        map.panTo(node.coords, { animate: true, duration: 0.6 });
      });
    });

    // Handle marker active state
    function setActiveMarker(activeId) {
      nodes.forEach(function(node) {
        var el = document.getElementById('marker-' + node.id);
        if (el) {
          if (node.id === activeId) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    // Listen for messages from parent window (Next.js)
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (data && data.type === 'SET_ACTIVE') {
        var activeId = data.id;
        setActiveMarker(activeId);
        
        var targetNode = nodes.find(function(n) { return n.id === activeId; });
        if (targetNode) {
          map.panTo(targetNode.coords, { animate: true, duration: 0.6 });
        }
      }
    });

    // Default initialization
    setTimeout(function() {
      setActiveMarker('tender-1');
    }, 500);

  </script>
</body>
</html>
